services:
  dc-standalone-backend:
    build: ./backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      # Override DB_HOST and others to point to standalone services
      - DATABASE_URL=postgresql://kalvixadmin:Kalvix@2026@dc-standalone-postgres:5432/divine_cardinal
      - REDIS_URL=redis://dc-standalone-redis:6379
      - MEILISEARCH_HOST=http://dc-standalone-meilisearch:7700
    depends_on:
      - dc-standalone-postgres
      - dc-standalone-redis
      - dc-standalone-meilisearch
    networks:
      - app_web
      - app_internal
    ports:
      - "4001:4000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '1G'

  dc-standalone-frontend:
    build: ./frontend
    restart: always
    env_file:
      - ./frontend/.env.local
    environment:
      - NODE_ENV=production
    depends_on:
      - dc-standalone-backend
    networks:
      - app_web
      - app_internal
    ports:
      - "3001:3000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '1G'

  dc-standalone-postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: divine_cardinal
      POSTGRES_USER: kalvixadmin
      POSTGRES_PASSWORD: Kalvix@2026
    ports:
      - "5433:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    networks:
      - app_internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '1G'

  dc-standalone-redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - ./redis/data:/data
    networks:
      - app_internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: '512M'

  dc-standalone-meilisearch:
    image: getmeili/meilisearch:v1.3
    restart: always
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: meilisearch_master_key_123
    volumes:
      - ./meili_data:/meili_data
    networks:
      - app_internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: '512M'

networks:
  app_internal:
  app_web:

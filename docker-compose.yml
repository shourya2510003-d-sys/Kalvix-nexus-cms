services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: kalvixnexus
      POSTGRES_USER: kalvixadmin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '1G'

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - ./redis/data:/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: '512M'

  meilisearch:
    image: getmeili/meilisearch:v1.3
    restart: always
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: meilisearch_master_key_123
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: '512M'

  traefik:
    image: traefik:v3.5
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=official@kalvixnexus.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/letsencrypt:/letsencrypt
      - ./traefik/dynamic:/etc/traefik/dynamic
    networks:
      - web
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: '512M'

  backend:
    build: ./backend
    restart: always
    environment:
      - DB_HOST=postgres
      - DB_USER=kalvixadmin
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=kalvix_platform
      - DB_PORT=5432
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic
    networks:
      - web
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.backend.rule=Host(`api.kalvixnexus.com`)"
      - "traefik.http.routers.backend.entrypoints=web"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '1G'

  frontend:
    build: ./frontend
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_ROOT_DOMAIN=kalvixnexus.com
    networks:
      - web
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.frontend.rule=Host(`kalvixnexus.com`) || Host(`www.kalvixnexus.com`) || Host(`divine.kalvixnexus.com`) || Host(`divinecardinal.kalvixnexus.com`)"
      - "traefik.http.routers.frontend.entrypoints=web,websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '1G'

networks:
  internal:
  web:

volumes:
  meili_data:
